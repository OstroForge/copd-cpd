<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img">
  <rect width="960" height="420" fill="#f4f6f2"/>
  <text x="24" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#12382c">On-scene pathway - teaching diagram, not the JRCALC page</text>
  <text x="24" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5b6b64">Follow live G0390. This is the session decision map.</text>

  <rect x="280" y="68" width="400" height="52" rx="6" fill="#12382c"/>
  <text x="480" y="90" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#f0c36a">Breathless patient - known or suspected COPD</text>
  <text x="480" y="108" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#d7e8df">ABCDE · usual sats · alert card · work of breathing</text>

  <line x1="480" y1="120" x2="480" y2="148" stroke="#12382c" stroke-width="2"/>
  <polygon points="480,154 474,144 486,144" fill="#12382c"/>

  <rect x="330" y="154" width="300" height="44" rx="6" fill="#d4a017"/>
  <text x="480" y="181" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#1a1206">Critically ill or tiring?</text>

  <line x1="330" y1="176" x2="150" y2="176" stroke="#12382c" stroke-width="2"/>
  <line x1="150" y1="176" x2="150" y2="214" stroke="#12382c" stroke-width="2"/>
  <line x1="630" y1="176" x2="810" y2="176" stroke="#12382c" stroke-width="2"/>
  <line x1="810" y1="176" x2="810" y2="214" stroke="#12382c" stroke-width="2"/>
  <text x="150" y="170" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#b42318">YES</text>
  <text x="810" y="170" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#176b45">NO</text>

  <rect x="24" y="220" width="252" height="168" rx="6" fill="#b42318"/>
  <text x="150" y="248" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">Time-critical</text>
  <text x="150" y="274" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#fff">Do not withhold high-flow O2</text>
  <text x="150" y="294" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#fff">Correct ABCDE</text>
  <text x="150" y="314" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#fff">ATMIST pre-alert</text>
  <text x="150" y="334" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#fff">Titrate once no longer critical</text>
  <text x="150" y="362" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#f8d0cc">NEWS2 Scale 1 unless T2 already documented</text>

  <rect x="354" y="220" width="252" height="168" rx="6" fill="#1c5242"/>
  <text x="480" y="248" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#f0c36a">Controlled oxygen</text>
  <text x="480" y="274" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#e7f4ee">Target 88-92% (or alert card)</text>
  <text x="480" y="294" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#e7f4ee">Start 4 L 28% Venturi</text>
  <text x="480" y="314" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#e7f4ee">Salbutamol 5 mg · 6-minute O2 drive</text>
  <text x="480" y="334" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#e7f4ee">Ipratropium once if severe</text>
  <text x="480" y="362" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#f0c36a">Oxygen target is not the NEWS2 scale</text>

  <rect x="684" y="220" width="252" height="168" rx="6" fill="#12382c"/>
  <text x="810" y="248" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#f0c36a">NEWS2</text>
  <text x="810" y="274" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#e7f4ee">Default Scale 1</text>
  <text x="810" y="294" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#e7f4ee">Scale 2 only if T2 failure</text>
  <text x="810" y="314" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#e7f4ee">is already documented</text>
  <text x="810" y="334" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#e7f4ee">Apply that record - do not decide it</text>
  <text x="810" y="362" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#f0c36a">Handover the scale you used</text>
</svg>
