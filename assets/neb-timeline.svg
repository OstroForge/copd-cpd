<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" role="img">
  <rect width="960" height="220" fill="#f4f6f2"/>
  <text x="24" y="28" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#12382c">Oxygen-driven neb - 6 minutes is the drive time, not a two-neb cap</text>
  <text x="24" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5b6b64">If COPD is a possibility. An air compressor is better when you have one.</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="24" y="72" width="200" height="88" rx="6" fill="#1c5242"/>
    <text x="124" y="104" text-anchor="middle" font-size="14" font-weight="700" fill="#f0c36a">1. Salbutamol 5 mg</text>
    <text x="124" y="126" text-anchor="middle" font-size="13" fill="#e7f4ee">Oxygen drive</text>
    <text x="124" y="146" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">6 minutes</text>

    <polygon points="236,116 252,108 252,124" fill="#12382c"/>

    <rect x="260" y="72" width="200" height="88" rx="6" fill="#d4a017"/>
    <text x="360" y="104" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1206">2. Stop the drive</text>
    <text x="360" y="126" text-anchor="middle" font-size="13" fill="#1a1206">Off the neb mask</text>
    <text x="360" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1206">Aim 88-92%</text>

    <polygon points="472,116 488,108 488,124" fill="#12382c"/>

    <rect x="496" y="72" width="200" height="88" rx="6" fill="#12382c"/>
    <text x="596" y="104" text-anchor="middle" font-size="14" font-weight="700" fill="#f0c36a">3. Still symptomatic?</text>
    <text x="596" y="126" text-anchor="middle" font-size="13" fill="#e7f4ee">Further 6-minute run</text>
    <text x="596" y="146" text-anchor="middle" font-size="13" fill="#e7f4ee">if clinically indicated</text>

    <polygon points="708,116 724,108 724,124" fill="#12382c"/>

    <rect x="732" y="72" width="204" height="88" rx="6" fill="#176b45"/>
    <text x="834" y="104" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Ipratropium</text>
    <text x="834" y="126" text-anchor="middle" font-size="13" fill="#e7f4ee">500 micrograms</text>
    <text x="834" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">once only</text>
  </g>
  <text x="24" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5b6b64">Do not leave oxygen driving the neb for 10-15 minutes. Time-critical features still override.</text>
</svg>
