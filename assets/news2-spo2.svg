<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" role="img">
  <rect width="920" height="280" fill="#f4f6f2"/>
  <text x="20" y="28" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#12382c">SpO2 scoring - teaching diagram, not the official RCP chart</text>
  <text x="20" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5b6b64">Use the live NEWS2 tool or ePR. This only shows why 90% looks different on the two scales.</text>

  <text x="20" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#12382c">Scale 1 - default</text>
  <g transform="translate(20,102)">
    <rect width="220" height="44" fill="#b42318"/>
    <text x="110" y="20" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">91% or below</text>
    <text x="110" y="36" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#fff">score 3</text>
    <rect x="220" width="140" height="44" fill="#c47b12"/>
    <text x="290" y="20" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1206">92-93%</text>
    <text x="290" y="36" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1a1206">score 2</text>
    <rect x="360" width="140" height="44" fill="#e2c36a"/>
    <text x="430" y="20" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1206">94-95%</text>
    <text x="430" y="36" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1a1206">score 1</text>
    <rect x="500" width="220" height="44" fill="#176b45"/>
    <text x="610" y="20" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">96% or above</text>
    <text x="610" y="36" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#fff">score 0</text>
    <rect x="8" y="-8" width="204" height="60" fill="none" stroke="#d4a017" stroke-width="3"/>
    <text x="110" y="68" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#8a5608">90% sits here = 3</text>
  </g>

  <text x="20" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#12382c">Scale 2 - only if type 2 failure is already documented</text>
  <g transform="translate(20,206)">
    <rect width="120" height="44" fill="#b42318"/>
    <text x="60" y="20" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">83% or below</text>
    <text x="60" y="36" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#fff">score 3</text>
    <rect x="120" width="90" height="44" fill="#c47b12"/>
    <text x="165" y="20" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#1a1206">84-85</text>
    <text x="165" y="36" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#1a1206">2</text>
    <rect x="210" width="90" height="44" fill="#e2c36a"/>
    <text x="255" y="20" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#1a1206">86-87</text>
    <text x="255" y="36" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#1a1206">1</text>
    <rect x="300" width="200" height="44" fill="#176b45"/>
    <text x="400" y="20" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">88-92% on O2</text>
    <text x="400" y="36" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#fff">score 0</text>
    <rect x="500" width="80" height="44" fill="#e2c36a"/>
    <text x="540" y="20" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#1a1206">93-94</text>
    <text x="540" y="36" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#1a1206">1</text>
    <rect x="580" width="80" height="44" fill="#c47b12"/>
    <text x="620" y="20" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#1a1206">95-96</text>
    <text x="620" y="36" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#1a1206">2</text>
    <rect x="660" width="80" height="44" fill="#b42318"/>
    <text x="700" y="20" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">97%+</text>
    <text x="700" y="36" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#fff">3</text>
    <rect x="318" y="-8" width="164" height="60" fill="none" stroke="#d4a017" stroke-width="3"/>
    <text x="400" y="68" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#8a5608">90% sits here = 0</text>
  </g>
</svg>
