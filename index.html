<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>COPD in Pre-hospital Care | Ambulance CPD</title>
  <style>
    :root {
      --navy: #12382c;
      --navy-2: #1c5242;
      --ink: #1c2333;
      --muted: #5b6b64;
      --paper: #f3f5f0;
      --card: #ffffff;
      --line: #d3d9d0;
      --amber: #d4a017;
      --amber-bg: #fff4e0;
      --teal: #1f7a6c;
      --teal-bg: #e6f4f1;
      --red: #b42318;
      --red-bg: #fdecea;
      --green: #176b45;
      --green-bg: #e7f6ee;
      --stage: #081510;
      --slide-w: min(100vw, 160vh);
      --slide-h: calc(var(--slide-w) * 9 / 16);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--stage); color: var(--ink); font-family: "Segoe UI", Calibri, Arial, sans-serif; }

    .stage {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 12px 56px;
    }

    .deck {
      position: relative;
      width: var(--slide-w);
      height: var(--slide-h);
      max-height: calc(100vh - 72px);
      overflow: hidden;
      isolation: isolate;
    }
    .slide {
      display: flex;
      flex-direction: column;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      max-height: none;
      background: var(--paper);
      color: var(--ink);
      padding: 36px 48px 44px;
      overflow: hidden;
      border: 1px solid #1c3f34;
      opacity: 0;
      visibility: hidden;
      transform: translateX(36px);
      transition: opacity 0.45s ease, transform 0.45s ease;
      pointer-events: none;
    }
    .slide:not(.active) * { visibility: hidden !important; }
    .slide.back { transform: translateX(-36px); }
    .slide.active {
      opacity: 1;
      visibility: visible;
      transform: none;
      pointer-events: auto;
      z-index: 2;
    }
    .slide.exit {
      opacity: 0;
      visibility: hidden;
      transform: translateX(-28px);
      z-index: 1;
    }
    .slide.title-slide {
      background:
        linear-gradient(90deg, rgba(8, 28, 22, 0.92) 0%, rgba(10, 40, 32, 0.58) 40%, rgba(18, 56, 44, 0.32) 100%),
        linear-gradient(rgba(18, 56, 44, 0.34), rgba(12, 42, 32, 0.34)),
        url("assets/title-ambulance.png") right center / cover no-repeat;
      color: #f7f4ee;
      justify-content: flex-end;
      padding: 48px 56px 56px;
    }
    .slide.title-slide h1 { color: #fff; }
    .slide.title-slide .subtitle { color: #e4f0ea; }
    .slide.title-slide .meta { color: #c5dcd0; }
    .slide.title-slide h1,
    .slide.title-slide .subtitle,
    .slide.title-slide .meta {
      text-shadow: 0 1px 2px #081510;
    }
    .slide.title-slide::before {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 14px;
      background: var(--amber);
    }

    .kicker {
      font-size: 15px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--amber);
      font-weight: 700;
      margin-bottom: 10px;
    }
    .title-slide .kicker { color: #f0c36a; }
    h1 {
      font-size: clamp(32px, 4.4vw, 58px);
      line-height: 1.08;
      font-weight: 750;
      letter-spacing: -0.03em;
      max-width: 16ch;
    }
    h2 {
      font-size: clamp(26px, 2.7vw, 40px);
      line-height: 1.15;
      letter-spacing: -0.03em;
      color: var(--navy);
      margin-bottom: 18px;
    }
    .subtitle { margin-top: 18px; font-size: 22px; color: #d7e8df; max-width: 42ch; }
    .meta { margin-top: 28px; color: #a8c4b6; font-size: 15px; }

    .body {
      flex: 1;
      display: grid;
      gap: 16px;
      font-size: 21px;
      line-height: 1.35;
      align-content: start;
      align-items: start;
    }
    .body.two { grid-template-columns: 1fr 1fr; }
    .body.three { grid-template-columns: 1fr 1fr 1fr; }
    .body.quiz { grid-template-columns: 1fr 1fr; gap: 10px; }
    ul { padding-left: 1.1em; }
    li { margin: 0.38em 0; }
    .small { font-size: 16px; color: var(--muted); }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      padding: 16px 18px;
      width: 100%;
    }
    .card h3 { font-size: 18px; color: var(--navy); margin-bottom: 8px; }
    .card p, .card li { font-size: 17px; }
    .myth { background: var(--red-bg); border-color: #f0b8b2; }
    .fact { background: var(--green-bg); border-color: #b7e0c8; }
    .warn { background: var(--amber-bg); border-color: #efd3a0; }
    .ok { background: var(--teal-bg); border-color: #b7ddd6; }
    .myth h3 { color: var(--red); }
    .fact h3 { color: var(--green); }
    .warn h3 { color: #8a5608; }
    .ok h3 { color: var(--teal); }

    .banner {
      background: var(--amber);
      color: #1a1206;
      font-weight: 750;
      font-size: clamp(22px, 2.4vw, 32px);
      padding: 16px 20px;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    .banner.dark {
      background: var(--navy);
      color: #fff;
    }
    .banner.red { background: var(--red); color: #fff; }
    .banner.teal { background: var(--teal); color: #fff; }

    .callout {
      border-left: 8px solid var(--amber);
      background: var(--amber-bg);
      padding: 16px 18px;
      font-size: 22px;
      font-weight: 650;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      font-size: 16px;
    }
    th, td {
      border: 1px solid var(--line);
      padding: 10px 12px;
      text-align: left;
      vertical-align: top;
    }
    th { background: var(--navy); color: #fff; font-weight: 650; }
    td.score { text-align: center; font-weight: 750; font-size: 24px; }
    .bad { background: var(--red-bg); color: var(--red); }
    .good { background: var(--green-bg); color: var(--green); }
    .mid { background: var(--amber-bg); color: #8a5608; }

    .footer-bar {
      position: absolute;
      left: 48px; right: 48px; bottom: 14px;
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.02em;
    }
    .title-slide .footer-bar { color: #8fb3a6; left: 56px; right: 56px; }

    .controls {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      height: 48px;
      background: #0a1914;
      color: #c5dcd0;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      font-size: 13px;
      z-index: 20;
    }
    .controls button, .notes-toggle {
      background: #1c4236;
      color: #e8f5ee;
      border: 0;
      padding: 7px 12px;
      cursor: pointer;
      font: inherit;
    }
    .controls button:hover { background: #2a5c4a; }
    .progress {
      flex: 1;
      height: 6px;
      background: #1c4236;
    }
    .progress span {
      display: block;
      height: 100%;
      background: var(--amber);
      width: 0%;
    }

    .notes {
      display: none;
      position: fixed;
      right: 12px;
      bottom: 60px;
      width: min(420px, 36vw);
      max-height: 42vh;
      overflow: auto;
      background: #102018;
      color: #e7f4ee;
      padding: 14px 16px;
      font-size: 14px;
      line-height: 1.45;
      z-index: 15;
      border-top: 4px solid var(--amber);
    }
    .notes.visible { display: block; }
    .notes strong { color: #f0c36a; }

    .reveal { opacity: 0; transform: translateY(8px); transition: 0.25s ease; }
    .slide.active .reveal { opacity: 1; transform: none; }
    .q { cursor: pointer; }
    .q::after {
      content: "Click to reveal";
      display: block;
      margin-top: 8px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
    }
    .q.open::after { display: none; }
    .answer { display: none; margin-top: 10px; }
    .q.open .answer { display: block; }

    .photo-frame {
      overflow: hidden;
      border: 1px solid var(--line);
      background: #0a1914;
      min-height: 0;
    }
    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #0a1914;
    }
    .photo-caption {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
    }
    .diagram-row {
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(4, 1fr);
      margin-top: 8px;
    }
    .diagram-row.three { grid-template-columns: 1fr 1.1fr 1fr; }
    .step {
      padding: 12px 14px;
      color: #fff;
      min-height: 0;
    }
    .step h3 { color: #f0c36a; font-size: 15px; margin-bottom: 6px; }
    .step p, .step li { font-size: 14px; line-height: 1.35; }
    .step.red { background: var(--red); }
    .step.green { background: var(--navy-2); }
    .step.gold { background: var(--amber); color: #1a1206; }
    .step.gold h3 { color: #1a1206; }
    .step.dark { background: var(--navy); }
    .bars { display: flex; width: 100%; height: 52px; margin: 6px 0 4px; font-size: 12px; font-weight: 700; }
    .bars span {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      line-height: 1.15;
      text-align: center;
      padding: 0 4px;
    }
    .bars .r { background: var(--red); }
    .bars .a { background: var(--amber); color: #1a1206; }
    .bars .y { background: #e2c36a; color: #1a1206; }
    .bars .g { background: var(--green); }
    .bars .mark { outline: 3px solid #f0c36a; outline-offset: -3px; }
    .build:not(.show) { display: none; }
    .build.show {
      display: block;
      animation: rise 0.45s ease both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: none; }
    }
    .slide.active .card:not(.build),
    .slide.active .banner:not(.build),
    .slide.active .callout:not(.build),
    .slide.active table,
    .slide.active .diagram,
    .slide.active .photo-frame {
      animation: rise 0.48s ease both;
    }
    .slide.active .body.two > :nth-child(2),
    .slide.active .body.three > :nth-child(2) { animation-delay: 0.12s; }
    .slide.active .body.three > :nth-child(3) { animation-delay: 0.22s; }
    .slide.active .banner:not(.build):nth-of-type(2) { animation-delay: 0.1s; }
    .slide.active .banner:not(.build):nth-of-type(3) { animation-delay: 0.18s; }
    .slide.active .banner:not(.build):nth-of-type(4) { animation-delay: 0.26s; }
    .slide.active .banner:not(.build):nth-of-type(5) { animation-delay: 0.34s; }
    .slide.title-slide.active h1 { animation: rise 0.7s ease both; }
    .slide.title-slide.active .subtitle { animation: rise 0.7s ease 0.14s both; }
    .slide.title-slide.active .meta { animation: rise 0.7s ease 0.26s both; }
    @media (prefers-reduced-motion: reduce) {
      .slide, .build { transition: none; }
      .slide.active .card,
      .slide.active .banner,
      .slide.active .callout,
      .slide.active table,
      .slide.active .diagram,
      .slide.active .photo-frame,
      .slide.title-slide.active h1,
      .slide.title-slide.active .subtitle,
      .slide.title-slide.active .meta { animation: none; }
    }

    html:fullscreen .controls {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    html:fullscreen .controls:hover,
    html:fullscreen .controls:focus-within {
      opacity: 1;
      pointer-events: auto;
    }

    body.audience .notes,
    body.audience #notesBtn { display: none !important; }
    body.audience .stage { padding-bottom: 12px; }

    .pv-side { display: contents; }
    .pv-side > :not(.notes) { display: none; }
    body.presenter {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(300px, 0.9fr);
      grid-template-rows: 1fr 48px;
      height: 100vh;
      overflow: hidden;
    }
    body.presenter .stage {
      grid-column: 1;
      grid-row: 1;
      min-height: 0;
      padding: 10px;
    }
    body.presenter .pv-side {
      display: flex;
      flex-direction: column;
      gap: 10px;
      grid-column: 2;
      grid-row: 1;
      min-height: 0;
      padding: 12px 14px 10px 0;
    }
    body.presenter .pv-side > :not(.notes) { display: block; }
    body.presenter .controls {
      grid-column: 1 / -1;
      grid-row: 2;
      position: static;
    }
    body.presenter .deck {
      width: 100%;
      height: 100%;
      max-height: none;
    }
    body.presenter .slide {
      width: 100%;
      height: 100%;
      aspect-ratio: auto;
      max-height: none;
    }
    body.presenter .notes {
      display: block;
      position: static;
      width: auto;
      max-height: none;
      flex: 1;
      min-height: 0;
    }
    body.presenter #notesBtn { display: none; }
    .pv-kicker {
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #f0c36a;
      font-weight: 700;
    }
    .pv-next-title {
      color: #e8f5ee;
      font-size: 16px;
      font-weight: 650;
      line-height: 1.3;
    }
    .pv-timer {
      background: #1c4236;
      color: #f0c36a;
      border: 0;
      font: inherit;
      font-size: 28px;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
      padding: 8px 12px;
      cursor: pointer;
      text-align: left;
    }
    .pv-hint {
      color: #a8c4b6;
      font-size: 12px;
      line-height: 1.4;
    }
    .pv-join-box {
      background: #102018;
      padding: 10px 12px;
      border-top: 3px solid var(--amber);
    }
    .pv-join-url {
      color: #e8f5ee;
      font-size: 13px;
      word-break: break-all;
      margin: 6px 0 8px;
      line-height: 1.3;
    }
    .pv-join-box input {
      width: 100%;
      margin-top: 8px;
      padding: 7px 8px;
      border: 1px solid #2a5c4a;
      background: #0a1914;
      color: #e8f5ee;
      font: inherit;
      font-size: 12px;
    }
    .pv-join-box button {
      width: 100%;
      margin-top: 6px;
    }
    body.audience #copyJoinBtn,
    body.vote #copyJoinBtn,
    body.audience #csvBtnBar,
    body.vote #csvBtnBar { display: none; }
    body:not(.live) #copyJoinBtn,
    body:not(.live) #csvBtnBar { display: none; }
    body.presenter #copyJoinBtn,
    body.presenter #csvBtnBar { display: none; }

    .poll-slide .body {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
      align-items: stretch;
    }
    .poll-top {
      display: grid;
      grid-template-columns: minmax(0, auto) 148px;
      gap: 16px;
      align-items: start;
      width: max-content;
      max-width: 100%;
    }
    .poll-prompt {
      font-size: clamp(22px, 2.6vw, 34px);
      font-weight: 750;
      line-height: 1.2;
      color: var(--navy);
      max-width: 28ch;
    }
    .poll-join {
      display: none;
      width: 148px;
      text-align: center;
      background: #fff;
      border: 1px solid var(--line);
      padding: 8px 8px 10px;
    }
    body.live .poll-join { display: block; }
    .poll-join img {
      width: 132px;
      height: 132px;
      display: block;
    }
    .poll-url {
      font-size: 11px;
      color: var(--muted);
      word-break: break-all;
      margin-top: 6px;
      line-height: 1.3;
    }
    .poll-phones {
      font-size: 13px;
      font-weight: 700;
      color: var(--teal);
      margin-top: 4px;
    }
    .poll-opts { display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 0; width: 100%; }
    .poll-opt {
      display: grid;
      grid-template-columns: 1fr auto;
      grid-template-rows: auto auto;
      gap: 4px 12px;
      text-align: left;
      border: 1px solid var(--line);
      background: #fff;
      padding: 12px 14px;
      position: relative;
      width: 100%;
    }
    .poll-lab { font-size: 20px; font-weight: 650; color: var(--navy); z-index: 1; }
    .poll-n { font-size: 20px; font-weight: 750; color: var(--navy); z-index: 1; }
    .poll-bar {
      grid-column: 1 / -1;
      height: 8px;
      background: #e4ebe6;
    }
    .poll-bar i {
      display: block;
      height: 100%;
      width: 0%;
      background: var(--navy-2);
      transition: width 0.35s ease;
    }
    .poll-slide.revealed .poll-opt.is-correct {
      background: var(--green-bg);
      border-color: #b7e0c8;
    }
    .poll-slide.revealed .poll-opt.is-correct .poll-bar i { background: var(--green); }
    .poll-teach {
      display: none;
      background: var(--green-bg);
      border: 1px solid #b7e0c8;
      padding: 12px 14px;
      font-size: 17px;
    }
    .poll-slide.revealed .poll-teach { display: block; }
    .poll-host { display: none; font-size: 13px; color: var(--muted); }
    body.live:not(.audience) .poll-host,
    body.fallback:not(.audience) .poll-host { display: block; }
    body.fallback .poll-opt { cursor: pointer; }
    body.fallback .poll-bar,
    body.fallback .poll-n,
    body.fallback .poll-join { display: none; }

    .poll-case h2 { font-size: clamp(22px, 2.3vw, 32px); margin-bottom: 8px; }
    .poll-case .poll-prompt {
      font-size: clamp(18px, 2vw, 24px);
      max-width: none;
    }
    .poll-case .body { gap: 8px; }
    .poll-detail {
      display: grid;
      grid-template-columns: 0.95fr 1.15fr;
      gap: 12px;
      align-items: start;
      min-width: 0;
    }
    .poll-facts {
      background: var(--card);
      border: 1px solid var(--line);
      padding: 10px 12px;
    }
    .poll-facts h3 { font-size: 15px; color: var(--navy); margin-bottom: 4px; }
    .poll-facts li { font-size: 15px; margin: 0.18em 0; }
    .poll-case .bars { height: 40px; font-size: 11px; margin: 4px 0; }
    .poll-case .poll-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; flex: 0; }
    .poll-case .poll-opt { padding: 10px 12px; }
    .poll-case .poll-lab { font-size: 17px; }

    .poll-news2 h2 { font-size: clamp(20px, 2.2vw, 30px); margin-bottom: 6px; }
    .poll-news2 .poll-prompt { font-size: clamp(16px, 1.7vw, 22px); max-width: none; }
    .poll-news2 .body { gap: 8px; }
    .poll-news2 .poll-detail { grid-template-columns: 0.82fr 1.18fr; gap: 10px; }
    .poll-news2 .poll-facts li { font-size: 14px; }
    .n2-live {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .n2-stat {
      background: var(--card);
      border: 1px solid var(--line);
      padding: 8px 10px;
      text-align: center;
    }
    .n2-stat span {
      display: block;
      font-size: 34px;
      font-weight: 750;
      color: var(--navy);
      line-height: 1;
    }
    .n2-stat-ok span { color: var(--green); }
    .n2-stat label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      font-weight: 650;
      margin-top: 4px;
    }
    .n2-caption {
      font-size: 11px;
      color: var(--muted);
      margin: 0 0 6px;
    }
    .n2-row {
      display: grid;
      grid-template-columns: 108px 1fr;
      gap: 6px;
      align-items: stretch;
      margin-bottom: 3px;
    }
    .n2-lab {
      font-size: 11px;
      font-weight: 700;
      color: var(--navy);
      display: flex;
      align-items: center;
      line-height: 1.2;
    }
    .n2-bands { display: flex; gap: 2px; min-height: 30px; }
    .n2-bands span,
    .n2-bands button {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      font-size: 10px;
      line-height: 1.15;
      text-align: center;
      border: 0;
      padding: 3px 2px;
      font-family: inherit;
    }
    .n2-bands .g { background: #2e7d4f; }
    .n2-bands .y { background: #c9a227; }
    .n2-bands .a { background: #d97820; }
    .n2-bands .r { background: #b42318; }
    .n2-bands button { cursor: pointer; }
    .n2-bands button.sel { outline: 3px solid #f0c36a; outline-offset: -3px; }
    .n2-bands.n2-spo2-2 span,
    .n2-bands.n2-spo2-2 button { font-size: 9px; line-height: 1.1; }
    .n2-bands.n2-spo2-2 { min-height: 42px; }
    .poll-slide:not(.poll-results) .poll-n,
    .poll-slide:not(.poll-results) .poll-bar { visibility: hidden; }
    body:not(.audience):not(.presenter) .poll-slide:not(.poll-results) .poll-n,
    body:not(.audience):not(.presenter) .poll-slide:not(.poll-results) .poll-bar { visibility: visible; }

    function stepBack(fromRemote) {
      if (build > 0) {

        if (!fromRemote) persist();
        return;
      }
      if (i > 0) go(i - 1, fromRemote);

        const blob = new Blob([text], { type: "text/csv;charset=utf-8" });
        const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-");
        const a = document.createElement("a");

    function paintSpread(box, spread, expected, emptyMsg) {

      const s = slides[i];
      const el = stage.querySelectorAll(".slide")[i];
      const poll = s && (s.type === "poll" || s.type === "poll-results") ? pollFor(s.pollId) : null;
      paintPresenterLive(s, poll);
      if (!s || !el || (s.type !== "poll" && s.type !== "poll-results")) return;
      const total = poll ? poll.total : 0;
      el.querySelectorAll(".poll-total").forEach((n) => { n.textContent = String(total); });
      if (s.type === "poll") {
        if (view !== "audience") {
          const q = s;
          if (q.layout === "news2") {
            const set = (sel, val) => {
              const n = el.querySelector(sel);
              if (n) n.textContent = String(val);
            };
            set(".n2-s1", poll ? (poll.scale1 || 0) : 0);
            set(".n2-s2", poll ? (poll.scale2 || 0) : 0);
            set(".n2-ok", poll ? (poll.correctCount || poll.correctScale1 || 0) : 0);
            const okLab = el.querySelector(".n2-ok-lab");
            const scale = (poll && poll.expectedScale) || q.expectedScale;
            if (okLab && scale) okLab.textContent = `correct NEWS on Scale ${scale}`;
            paintSpread(el.querySelector(".host-live-spread"), poll && poll.spread, {
              scale: scale,
              total: (poll && poll.expectedTotal) || q.expectedTotal
            });
          } else {
            el.querySelectorAll(".poll-opt").forEach((opt, n) => {
              const c = poll && poll.counts ? (poll.counts[n] || 0) : 0;
              const num = opt.querySelector(".poll-n");
              const barFill = opt.querySelector(".poll-bar i");
              if (num) num.textContent = String(c);
              if (barFill) barFill.style.width = total ? `${Math.round((c / total) * 100)}%` : "0%";
            });
          }
        }
        return;
      }
      const q = slides.find((x) => x.type === "poll" && x.pollId === s.pollId) || s;
      if (q.layout === "news2") {
        const set = (sel, val) => {
          const n = el.querySelector(sel);
          if (n) n.textContent = String(val);
        };
        set(".n2-s1", poll ? (poll.scale1 || 0) : 0);
        set(".n2-s2", poll ? (poll.scale2 || 0) : 0);
        set(".n2-ok", poll ? (poll.correctCount || poll.correctScale1 || 0) : 0);
        const okLab = el.querySelector(".n2-ok-lab");
        const scale = (poll && poll.expectedScale) || q.expectedScale;
        if (okLab && scale) okLab.textContent = `correct NEWS on Scale ${scale}`;
        paintSpread(el.querySelector(".n2-spread"), poll && poll.spread, {
          scale: scale,
          total: (poll && poll.expectedTotal) || q.expectedTotal
        }, "No scores received for this patient yet.");
        const teach = el.querySelector(".poll-teach");
        if (teach) teach.innerHTML = (poll && (poll.revealed || poll.total) && q.teach) ? q.teach : "";
        return;
      }
      el.querySelectorAll(".poll-opt").forEach((opt, n) => {
        const c = poll && poll.counts ? (poll.counts[n] || 0) : 0;
        const num = opt.querySelector(".poll-n");
        const barFill = opt.querySelector(".poll-bar i");
        if (num) num.textContent = String(c);
        if (barFill) barFill.style.width = total ? `${Math.round((c / total) * 100)}%` : "0%";
        opt.classList.toggle("is-correct", !!(typeof q.correct === "number" && q.correct === n && (poll && (poll.revealed || poll.total))));
      });
      const teach = el.querySelector(".poll-teach");
      if (teach) teach.innerHTML = (poll && (poll.revealed || poll.total) && q.teach) ? q.teach : "";
    }

    async function hostAction(action, extra) {
      if (view === "audience" || view === "vote") return null;
      try {
        const headers = { "Content-Type": "application/json" };
        if (hub.token) headers["X-Host-Token"] = hub.token;
        if (view !== "audience" && view !== "vote") headers["X-Presenter-Role"] = "1";
        const res = await fetch("/api/host", {
          method: "POST",
          headers,
          body: JSON.stringify(Object.assign({ action }, extra || {}))
        });
        if (!res.ok) return null;
        const data = await res.json();
        if (data && data.poll) {
          rememberPoll(data.poll);
          const cached = pollCache[data.poll.id];
          hub.poll = cached && (cached.total || 0) > (data.poll.total || 0) ? cached : data.poll;
          paintPoll();
        }
        return data;
      } catch (err) {
        return null;
      }
    }

    async function hostFollowSlide() {
      if (!hub.ok || view === "audience" || view === "vote") return;
      const idx = i;
      const s = slides[idx];
      if (s && s.type === "poll") {
        if (lastHostId === s.pollId) return;
        lastHostId = s.pollId;
        const payload = {
          id: s.pollId,
          prompt: s.votePrompt || s.prompt,
          options: s.options || [],
          correct: typeof s.correct === "number" ? s.correct : null,
          teach: s.teach || "",
          kind: s.kind || (s.layout === "news2" ? "news2" : "choice")
        };
        if (payload.kind === "news2") {
          payload.expectedTotal = s.expectedTotal;
          payload.expectedScale = s.expectedScale;
          payload.obs = s.obs || {};
        }
        await hostAction("start", payload);
        return;
      }
      if (s && s.type === "poll-results") {
        lastHostId = s.pollId + ":results";
        await hostAction("reveal");
        return;
      }
      if (lastHostId) {
        lastHostId = null;
        await hostAction("idle");
      }
    }

    async function tickHub() {
      try {
        const res = await fetch("/api/poll", { cache: "no-store" });
        if (!res.ok) {
          setHubLive(false);
          return;
        }
        hub.poll = await res.json();
        rememberPoll(hub.poll);
        if (!hub.ok) setHubLive(true);
        const s = slides[i];
        if (
          s && s.type === "poll-results"
          && view !== "audience" && view !== "vote"
          && hub.poll && hub.poll.id === s.pollId && hub.poll.open
        ) {
          await hostAction("reveal");
          return;
        }
        paintPoll();
      } catch (err) {
        setHubLive(false);
      }
    }

    async function probeHub() {
      try {
        const res = await fetch("/api/join", { cache: "no-store" });
        if (!res.ok) { setHubLive(false); return; }
        const data = await res.json();
        if (data.hostToken) {
          hub.token = data.hostToken;
          sessionStorage.setItem("copd-host-token", data.hostToken);
        }
        const saved = sessionStorage.getItem("copd-public-join");
        hub.join = saved || pageJoinFallback() || data.join || "";
        setHubLive(!!data.live);
        fillJoin();
        await hostFollowSlide();
        await tickHub();
      } catch (err) {
        setHubLive(false);
      }
    }

    window.go = go;

    function openAudienceWindow() {
      const url = new URL(location.href);
      url.searchParams.set("view", "audience");
      url.searchParams.delete("host");
      audienceWin = window.open(url.toString(), "copd-audience");
      applyView();
    }

    function startPresenterView() {
      if (view === "audience") return;
      if (view !== "presenter") {
        view = "presenter";
        const url = new URL(location.href);
        url.searchParams.set("view", "presenter");
        history.replaceState(null, "", url);
      }
      applyView();
      notesEl.classList.add("visible");
      paintPoll();
      openAudienceWindow();
    }

    document.getElementById("prev").onclick = () => stepBack();
    document.getElementById("next").onclick = () => stepForward();
    document.getElementById("notesBtn").onclick = () => {
      if (view === "audience") return;
      notesEl.classList.toggle("visible");
    };
    pvBtn.onclick = () => {
      if (view === "presenter") openAudienceWindow();
      else startPresenterView();
    };
    const copyJoin = document.getElementById("copyJoin");
    const copyJoinBtn = document.getElementById("copyJoinBtn");
    if (copyJoin) copyJoin.onclick = copyJoinLink;
    if (copyJoinBtn) copyJoinBtn.onclick = copyJoinLink;
    const csvBtn = document.getElementById("csvBtn");
    const csvBtnBar = document.getElementById("csvBtnBar");
    if (csvBtn) csvBtn.onclick = downloadResults;
    if (csvBtnBar) csvBtnBar.onclick = downloadResults;
    const joinOverride = document.getElementById("joinOverride");
    if (joinOverride) {
      const savedJoin = sessionStorage.getItem("copd-public-join") || "";
      joinOverride.value = savedJoin;
      joinOverride.addEventListener("change", () => {
        const v = joinOverride.value.trim();
        if (!v) {
          sessionStorage.removeItem("copd-public-join");
          probeHub();
          return;
        }
        const join = normaliseJoin(v);
        sessionStorage.setItem("copd-public-join", join);
        joinOverride.value = join;
        setJoin(join);
      });
    }
    document.getElementById("fsBtn").onclick = () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    };
    timerEl.onclick = () => { timerStarted = Date.now(); };

    window.addEventListener("keydown", (e) => {
      if (view === "vote") return;
      if (["ArrowRight", "PageDown", " ", "Enter"].includes(e.key)) { e.preventDefault(); stepForward(); }
      if (["ArrowLeft", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); stepBack(); }
      if (e.key === "Home") go(0);
      if (e.key === "End") go(slides.length - 1);
      if ((e.key === "n" || e.key === "N") && view !== "audience") notesEl.classList.toggle("visible");
      if (e.key === "f" || e.key === "F") document.getElementById("fsBtn").click();
      if ((e.key === "s" || e.key === "S") && view !== "audience") startPresenterView();
    });

    window.addEventListener("storage", (e) => {
      if (e.key !== STORE || e.newValue == null) return;
      try { applyRemote(JSON.parse(e.newValue)); } catch (err) { /* ignore */ }
    });
    if (channel) {
      channel.addEventListener("message", (e) => applyRemote(e.data || {}));
    }

    setInterval(() => {
      const sec = Math.floor((Date.now() - timerStarted) / 1000);
      const m = String(Math.floor(sec / 60)).padStart(2, "0");
      const s = String(sec % 60).padStart(2, "0");
      timerEl.textContent = `${m}:${s}`;
    }, 1000);

    if (view === "vote") {
      runVoteApp();
    } else {
      applyView();
      stage.innerHTML = `<div class="deck">${slides.map(slideMarkup).join("")}</div>`;
      if (build > buildsOn(i)) build = buildsOn(i);
      applySlide();
      stage.addEventListener("click", (e) => {
        const opt = e.target.closest(".poll-opt");
        if (!opt || hub.ok || view === "audience") return;
        const slide = opt.closest(".poll-slide");
        if (slide && Number(slide.dataset.i) === i) {
          if (!revealCurrentPoll() && slides[i + 1] && slides[i + 1].type === "poll-results") go(i + 1);
        }
      });
      probeHub();
      setInterval(tickHub, 700);
    }

    function runVoteApp() {
      document.body.classList.add("vote");
      document.getElementById("voteApp").hidden = false;
      document.title = "COPD CPD — Vote";
      const meta = document.querySelector('meta[name="viewport"]');
      if (meta) meta.setAttribute("content", "width=device-width, initial-scale=1, maximum-scale=1");
      const statusEl = document.getElementById("voteStatus");
      const promptEl = document.getElementById("votePrompt");
      const optsEl = document.getElementById("voteOpts");
      const teachEl = document.getElementById("voteTeach");
      let voter = localStorage.getItem("copd-voter-id");
      if (!voter) {
        voter = (crypto.randomUUID && crypto.randomUUID()) || ("v" + Math.random().toString(36).slice(2));
        localStorage.setItem("copd-voter-id", voter);
      }
      let picked = null;
      let seenId = null;
      let news2 = { scale: 1, scores: {}, picks: {} };
      let lastNews2Draw = "";
      async function vote(choice) {
        picked = choice;
        try {
          await fetch("/api/vote", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ voter, choice })
          });
        } catch (err) { /* next tick will show state */ }
        draw();
      }
      function news2Complete() {
        return NEWS2_KEYS.every((k) => news2.scores[k] != null);
      }
      function news2Total() {
        return NEWS2_KEYS.reduce((n, k) => n + (Number(news2.scores[k]) || 0), 0);
      }
      async function voteNews2() {
        if (!news2Complete() || (hub.poll && hub.poll.revealed)) return;
        picked = { scale: news2.scale, total: news2Total() };
        try {
          await fetch("/api/vote", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ voter, scale: news2.scale, scores: news2.scores })
          });
        } catch (err) { /* next tick will show state */ }
        draw();
      }
      function obsHtml(obs) {
        if (!obs) return "";
        const order = [
          ["rr", "RR"], ["spo2", "SpO₂"], ["o2", "Air / O₂"], ["sbp", "SBP"],
          ["pulse", "Pulse"], ["con", "Consciousness"], ["temp", "Temp"]
        ];
        const bits = order.filter(([k]) => obs[k]).map(([k, lab]) => `<li><strong>${lab}</strong> ${obs[k]}</li>`).join("");
        const hx = obs.hx ? `<p>${obs.hx}</p>` : "";
        return `<div class="n2-obs">${hx}<ul>${bits}</ul></div>`;
      }
      function drawNews2(p) {
        const stamp = [p.id, !!p.revealed, news2.scale, JSON.stringify(news2.picks), JSON.stringify(news2.scores), !!picked].join("|");
        if (stamp === lastNews2Draw) return;
        lastNews2Draw = stamp;
        promptEl.innerHTML = p.prompt || "";
        if (p.revealed) statusEl.textContent = "Scores are in. Here is the teaching point.";
        else if (picked) statusEl.textContent = "Score sent. You can change it until the room moves on.";
        else statusEl.textContent = "Pick Scale 1 or 2 for SpO₂, then tap every category.";
        const rowFor = (key) => NEWS2_ROWS.find((row) => row.key === key);
        const rows = [
          { key: "rr", label: "Respiration rate", bands: rowFor("rr").bands },
          { key: "spo2", label: "SpO₂ (the scale you chose)", bands: NEWS2_SPO2[news2.scale] },
          { key: "o2", label: "Air or oxygen", bands: rowFor("o2").bands },
          { key: "sbp", label: "Systolic BP", bands: rowFor("sbp").bands },
          { key: "pulse", label: "Pulse", bands: rowFor("pulse").bands },
          { key: "con", label: "Consciousness", bands: rowFor("con").bands },
          { key: "temp", label: "Temperature °C", bands: rowFor("temp").bands }
        ];
        const chart = rows.map((row) => {
          const buttons = row.bands.map((b, n) => {
            const on = news2.picks[row.key] === n;
            return `<button type="button" class="${b.c}${on ? " sel" : ""}" data-key="${row.key}" data-i="${n}" data-score="${b.s}"${p.revealed ? " disabled" : ""}>${b.t}<br><strong>${b.s}</strong></button>`;
          }).join("");
          const tight = row.key === "spo2" && news2.scale === 2 ? " n2-spo2-2" : "";
          return `<div class="n2-row"><div class="n2-lab">${row.label}</div><div class="n2-bands${tight}">${buttons}</div></div>`;
        }).join("");
        const ready = news2Complete();
        optsEl.innerHTML = `
          ${obsHtml(p.obs)}
          <div class="n2-scale-pick">
            <button type="button" data-scale="1"${news2.scale === 1 ? ' class="sel"' : ""}${p.revealed ? " disabled" : ""}>SpO₂ Scale 1</button>
            <button type="button" data-scale="2"${news2.scale === 2 ? ' class="sel"' : ""}${p.revealed ? " disabled" : ""}>SpO₂ Scale 2</button>
          </div>
          <p class="n2-caption">Teaching NEWS2 bands — not the official RCP chart</p>
          ${chart}
          <div class="n2-scoreline">
            <span>Your NEWS2</span>
            <strong>${ready ? news2Total() : "—"}</strong>
            <span>Scale ${news2.scale}</span>
          </div>
          <button type="button" class="vote-send"${ready && !p.revealed ? "" : " disabled"}>${picked ? "Update this score" : "Send this score"}</button>`;
        optsEl.querySelectorAll("[data-scale]").forEach((btn) => {
          btn.onclick = () => {
            if (p.revealed) return;
            const next = Number(btn.dataset.scale);
            if (news2.scale !== next) {
              news2.scale = next;
              delete news2.scores.spo2;
              delete news2.picks.spo2;
            }
            draw();
          };
        });
        optsEl.querySelectorAll(".n2-bands button").forEach((btn) => {
          btn.onclick = () => {
            if (p.revealed) return;
            news2.picks[btn.dataset.key] = Number(btn.dataset.i);
            news2.scores[btn.dataset.key] = Number(btn.dataset.score);
            draw();
          };
        });
        const send = optsEl.querySelector(".vote-send");
        if (send) send.onclick = () => voteNews2();
        if (p.revealed && p.teach) {
          teachEl.innerHTML = p.teach;
          teachEl.classList.add("show");
        } else {
          teachEl.classList.remove("show");
          teachEl.textContent = "";
        }
      }
      function draw(poll) {
        if (arguments.length) hub.poll = poll;
        const p = hub.poll;
        if (!p || !p.id || (!p.open && !p.revealed)) {
          lastNews2Draw = "";
          statusEl.textContent = hub.ok === false
            ? "Cannot reach the laptop. Join the same Wi-Fi, then open this link again."
            : "Waiting for a question…";
          promptEl.textContent = "";
          optsEl.innerHTML = "";
          teachEl.classList.remove("show");
          teachEl.textContent = "";
          return;
        }
        if (p.id !== seenId) {
          seenId = p.id;
          picked = null;
          news2 = { scale: 1, scores: {}, picks: {} };
          lastNews2Draw = "";
        }
        if (p.kind === "news2") {
          drawNews2(p);
          return;
        }
        promptEl.innerHTML = p.prompt || "";
        if (p.revealed) statusEl.textContent = "Answer in. Here is the teaching point.";
        else if (picked != null) statusEl.textContent = "Vote in. You can change it until the room moves on.";
        else statusEl.textContent = "Tap one answer";
        optsEl.innerHTML = "";
        (p.options || []).forEach((label, n) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "vote-btn";
          btn.textContent = label;
          if (picked === n) btn.classList.add("picked");
          if (p.revealed && p.correct === n) btn.classList.add("right");
          if (p.revealed && picked === n && p.correct != null && p.correct !== n) btn.classList.add("wrong");
          btn.disabled = !!p.revealed;
          btn.onclick = () => vote(n);
          optsEl.appendChild(btn);
        });
        if (p.revealed && p.teach) {
          teachEl.innerHTML = p.teach;
          teachEl.classList.add("show");
        } else {
          teachEl.classList.remove("show");
          teachEl.textContent = "";
        }
      }
      async function tick() {
        try {
          const res = await fetch("/api/poll", { cache: "no-store" });
          if (!res.ok) { hub.ok = false; draw(null); return; }
          hub.ok = true;
          draw(await res.json());
        } catch (err) {
          hub.ok = false;
          draw(null);
        }
      }
      tick();
      setInterval(tick, 700);
    }
  </script>
</body>
</html>
